# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME
#background_opacity 0.7

cursor_trail 3
cursor_trail_decay 0.1 0.4
tab_bar_style powerline
tab_powerline_style angled
notify_on_cmd_finish invisible 10

# Allow local launchers to open tabs, using sockets inside the private runtime dir.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-vicinae-{kitty_pid}

# Move the current tab to another OS window (choose the destination).
map ctrl+shift+m detach_tab ask
# Detach the current tab into a new OS window.
map ctrl+shift+d detach_tab

# BEGIN_KITTY_FONTS
font_family      family="IosevkaTerm Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
